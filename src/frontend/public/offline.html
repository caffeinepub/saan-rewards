<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ff4444">
    <title>Offline - Traffic Jam</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #1a1a1a 0%, #2a2a2a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #ffffff;
        }
        .container {
            text-align: center;
            max-width: 400px;
            background: #2a2a2a;
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            border: 1px solid #3a3a3a;
        }
        .icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            background: linear-gradient(135deg, #ff4444 0%, #cc0000 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 12px;
            color: #ffffff;
        }
        p {
            color: #aaaaaa;
            line-height: 1.6;
            margin-bottom: 24px;
            font-size: 15px;
        }
        .button {
            display: inline-block;
            background: linear-gradient(135deg, #ff4444 0%, #cc0000 100%);
            color: white;
            padding: 14px 32px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            font-size: 16px;
            transition: transform 0.2s, box-shadow 0.2s;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(255, 68, 68, 0.3);
        }
        .button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(255, 68, 68, 0.4);
        }
        .button:active {
            transform: translateY(0);
        }
        .status {
            margin-top: 20px;
            padding: 12px;
            background: #3a2a2a;
            border-radius: 8px;
            font-size: 14px;
            color: #ff8888;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .wifi-icon {
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">📡</div>
        <h1>You're Offline</h1>
        <p>Traffic Jam needs an internet connection to load. Please check your network settings and try again.</p>
        <button class="button" onclick="window.location.reload()">
            Try Again
        </button>
        <div class="status">
            <span class="wifi-icon">📶</span>
            <span>Waiting for connection...</span>
        </div>
    </div>

    <script>
        // Auto-reload when connection is restored
        window.addEventListener('online', () => {
            window.location.reload();
        });

        // Update status indicator
        function updateStatus() {
            const status = document.querySelector('.status');
            if (navigator.onLine) {
                status.innerHTML = '<span class="wifi-icon">✅</span><span>Connection restored!</span>';
                status.style.background = '#2a3a2a';
                status.style.color = '#88ff88';
                setTimeout(() => window.location.reload(), 1000);
            }
        }

        setInterval(updateStatus, 2000);
    </script>
</body>
</html>
