<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teen Patti - Offline</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            text-align: center;
            max-width: 400px;
        }
        .icon {
            font-size: 64px;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 28px;
            margin-bottom: 12px;
            color: #16a34a;
        }
        p {
            font-size: 16px;
            line-height: 1.6;
            color: #a0a0a0;
            margin-bottom: 24px;
        }
        .status {
            display: inline-block;
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .status.offline {
            color: #ef4444;
        }
        .status.online {
            color: #16a34a;
        }
        button {
            background: #16a34a;
            color: white;
            border: none;
            padding: 12px 32px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background: #15803d;
        }
        button:disabled {
            background: #4a4a4a;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">🃏</div>
        <h1>Teen Patti</h1>
        <div class="status offline" id="status">Offline</div>
        <p>You're currently offline. Please check your internet connection to play Teen Patti.</p>
        <button id="retryBtn" onclick="location.reload()">Try Again</button>
    </div>

    <script>
        function updateOnlineStatus() {
            const status = document.getElementById('status');
            const retryBtn = document.getElementById('retryBtn');
            
            if (navigator.onLine) {
                status.textContent = 'Back Online';
                status.className = 'status online';
                retryBtn.disabled = false;
                setTimeout(() => {
                    location.reload();
                }, 1000);
            } else {
                status.textContent = 'Offline';
                status.className = 'status offline';
                retryBtn.disabled = false;
            }
        }

        window.addEventListener('online', updateOnlineStatus);
        window.addEventListener('offline', updateOnlineStatus);
        
        // Check status on load
        updateOnlineStatus();
    </script>
</body>
</html>
