<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Editor - Offline</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 400px;
            text-align: center;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 40px 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .icon {
            font-size: 64px;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 12px;
            color: #ffffff;
        }
        p {
            font-size: 16px;
            line-height: 1.6;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 24px;
        }
        .status {
            display: inline-block;
            padding: 8px 16px;
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 8px;
            font-size: 14px;
            color: #fca5a5;
            margin-bottom: 24px;
        }
        .status.online {
            background: rgba(34, 197, 94, 0.2);
            border-color: rgba(34, 197, 94, 0.3);
            color: #86efac;
        }
        button {
            background: #7c3aed;
            color: white;
            border: none;
            padding: 14px 32px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            width: 100%;
        }
        button:hover {
            background: #6d28d9;
            transform: translateY(-1px);
        }
        button:active {
            transform: translateY(0);
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .note {
            margin-top: 24px;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.5);
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">🎬</div>
        <h1>Video Editor</h1>
        <p>You're currently offline. The app needs to load its core files before you can edit videos offline.</p>
        
        <div class="status" id="status">
            📡 Offline
        </div>
        
        <button id="retryBtn" onclick="location.reload()">
            Retry Connection
        </button>
        
        <p class="note">
            Once loaded, you can edit local videos without an internet connection. 
            Your videos are never uploaded and stay on your device.
        </p>
    </div>

    <script>
        // Monitor connection status
        function updateStatus() {
            const statusEl = document.getElementById('status');
            const retryBtn = document.getElementById('retryBtn');
            
            if (navigator.onLine) {
                statusEl.textContent = '✓ Online';
                statusEl.classList.add('online');
                retryBtn.textContent = 'Reload App';
                // Auto-reload when back online
                setTimeout(() => {
                    location.reload();
                }, 1000);
            } else {
                statusEl.textContent = '📡 Offline';
                statusEl.classList.remove('online');
                retryBtn.textContent = 'Retry Connection';
            }
        }

        // Check status on load
        updateStatus();

        // Listen for connection changes
        window.addEventListener('online', updateStatus);
        window.addEventListener('offline', updateStatus);

        // Periodic check
        setInterval(updateStatus, 3000);
    </script>
</body>
</html>
